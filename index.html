<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>迴轉壽司計數機</title>
<meta name="theme-color" content="#176a56">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="壽司計數">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<style>
:root{--bg:#f2f5f3;--card:#fff;--fg:#1b2420;--mut:#5b6962;--line:#d3dbd7;--acc:#176a56;--onacc:#fff;--pl:#fff;--bad:#c0312b;--warn:#a86a00;--ok:#17795e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111714;--card:#1a221e;--fg:#e8efeb;--mut:#9aaaa2;--line:#2d3933;--acc:#4cc3a3;--onacc:#0b1a15;--pl:#222c27;--bad:#ff7a70;--warn:#f0b64f;--ok:#5fd0ae;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111714;--card:#1a221e;--fg:#e8efeb;--mut:#9aaaa2;--line:#2d3933;--acc:#4cc3a3;--onacc:#0b1a15;--pl:#222c27;--bad:#ff7a70;--warn:#f0b64f;--ok:#5fd0ae;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 140px}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:17px;margin:22px 0 4px}
h3{font-size:16px;margin:0 0 8px}
.ctl{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ctl label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--mut)}
select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--acc)}
#bud{width:110px}
button{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer}
button.pri{background:var(--acc);color:var(--onacc);border-color:var(--acc);font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0 6px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:0;background:none;color:var(--mut);padding:10px 0;border-bottom:3px solid transparent}
.tabs button.on{color:var(--fg);border-bottom-color:var(--acc);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 8px 10px;text-align:center;position:relative}
.plate{width:104px;height:104px;border-radius:50%;border:0;padding:0;background:radial-gradient(circle,var(--pl) 0 61%,var(--c) 63%);box-shadow:0 0 0 2px var(--line);transition:transform .08s}
.plate:active{transform:scale(.93)}
.plate b{font-size:34px;font-variant-numeric:tabular-nums}
.nm{font-weight:600;margin-top:8px}
.pr{color:var(--mut);font-size:14px}
.minus{position:absolute;top:8px;right:8px;padding:2px 10px;font-size:18px}
.hint{color:var(--mut);font-size:14px;margin:4px 0 10px}
.plan,.person,.sum{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{border:2px solid var(--c);border-radius:99px;padding:2px 10px;font-size:14px}
.plan p{margin:0}
.row{display:flex;align-items:center;gap:10px;padding:5px 0;justify-content:space-between}
.row>.nm2{flex:1}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c);flex:none;box-shadow:0 0 0 1px var(--line)}
.st{display:flex;align-items:center;gap:8px}
.st b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.st button{padding:2px 12px;font-size:18px}
.ph{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.ph input{flex:1;font-weight:600}
.btns{display:flex;gap:10px;margin-top:12px}
.set{display:flex;align-items:center;gap:10px;margin:8px 0}
.set input{width:96px}
.add{display:flex;gap:8px;flex-wrap:wrap}
.add input:first-child{flex:1;min-width:150px}
.add input[type=number]{width:90px}
.warn{color:var(--warn)}.bad{color:var(--bad)}.ok{color:var(--ok)}
.foot{color:var(--mut);font-size:13px;margin-top:24px}
#bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center;justify-content:center}
#bar>div:first-child{flex:1;max-width:260px}
#bar small{color:var(--mut);display:block;font-size:12px}
#bar strong{font-size:26px;font-variant-numeric:tabular-nums}
#bar .r{font-size:14px;text-align:right}
@media (prefers-reduced-motion:reduce){.plate{transition:none}}
</style>
</head>
<body>
<div class="wrap">
<h1>迴轉壽司計數機</h1>
<div class="ctl">
<label>地區 <select id="reg"></select></label>
<label><input type="checkbox" id="fee"> +10% 服務費</label>
<label>預算 <input id="bud" type="number" inputmode="decimal" min="0" placeholder="不設定"></label>
</div>
<nav class="tabs">
<button data-tab="count">計數</button><button data-tab="budget">預算</button><button data-tab="split">拆帳</button><button data-tab="set">價格</button>
</nav>
<main id="v"></main>
<p class="foot">預設碟價只是參考，各分店及優惠期間可能不同，請在「價格」分頁改成餐牌上的價錢。計算結果僅供參考，結帳前請核對帳單。</p>
</div>
<div id="bar"></div>
<script>
const REG={
hk:{n:'香港',s:'HK$',p:[['red','紅碟',12,'#d8453d'],['silver','銀碟',17,'#a7b0b8'],['gold','金碟',22,'#d9a21b'],['black','黑碟',27,'#3a403d']]},
tw:{n:'台灣',s:'NT$',p:[['red','紅碟',40,'#d8453d'],['gold','金碟',60,'#d9a21b'],['blue','藍碟',80,'#2f6fd0'],['black','黑碟',100,'#3a403d']]},
jp:{n:'日本',s:'¥',p:[['red','赤皿',120,'#d8453d'],['gold','金皿',180,'#d9a21b'],['blue','青皿',280,'#2f6fd0'],['black','黒皿',380,'#3a403d']]}
};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const KEY='sushi-calc-v1';
const newPeople=()=>[{name:'朋友 1',c:{}},{name:'朋友 2',c:{}}];
let S={region:'hk',fee:true,budget:0,tab:'count',ov:{},custom:{},counts:{},people:newPeople(),msg:''};
try{const d=JSON.parse(localStorage.getItem(KEY)||'{}');for(const k of['region','fee','ov','custom'])if(d[k]!==undefined)S[k]=d[k];if(!REG[S.region])S.region='hk'}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify({region:S.region,fee:S.fee,ov:S.ov,custom:S.custom}))}catch(e){}}
const cu=()=>S.custom[S.region]||(S.custom[S.region]=[]);
const mult=()=>S.fee?1.1:1;
const money=n=>REG[S.region].s+(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
function items(){const o=S.ov[S.region]||{};return REG[S.region].p.map(([id,name,p,c])=>({id,name,base:p,p:o[id]!==undefined?o[id]:p,c})).concat(cu().map(x=>({id:x.id,name:x.name,p:x.p,base:x.p,c:'#7a5bb5',custom:1})))}
const sum=c=>items().reduce((a,i)=>a+(c[i.id]||0)*i.p,0);
const cnt=c=>Object.values(c).reduce((a,b)=>a+b,0);

function planMax(P,B){const c={},lo=P[0];let r=B;const n=Math.floor(r/lo.p);c[lo.id]=n;r-=n*lo.p;
for(let g=true;g;){g=false;for(let k=P.length-1;k>0;k--){if(c[lo.id]>0&&P[k].p-lo.p<=r){c[lo.id]--;c[P[k].id]=(c[P[k].id]||0)+1;r-=P[k].p-lo.p;g=true;break}}}return c}
function planBal(P,B){const c={};let r=B,a=true;while(a){a=false;for(const i of P)if(i.p<=r){c[i.id]=(c[i.id]||0)+1;r-=i.p;a=true}}return c}
function planTop(P,B){const c={};let r=B;for(let k=P.length-1;k>=0;k--){const n=Math.floor(r/P[k].p);if(n>0){c[P[k].id]=n;r-=n*P[k].p}}return c}

function vCount(){return '<div class="grid">'+items().map(i=>`<div class="card"><button class="plate" style="--c:${i.c}" data-add="${i.id}" aria-label="${esc(i.name)} 加一碟"><b>${S.counts[i.id]||0}</b></button><div class="nm">${esc(i.name)}</div><div class="pr">${money(i.p)}</div><button class="minus" data-sub="${i.id}" aria-label="${esc(i.name)} 減一碟">−</button></div>`).join('')+'</div>'}

function vBudget(){
if(!(S.budget>0))return '<p class="hint">在上方輸入預算，這裡會建議三組餐單。</p>';
const P=items().filter(i=>!i.custom).sort((a,b)=>a.p-b.p),m=mult(),B=S.budget/m+1e-9;
if(B<P[0].p)return `<p class="hint">預算不夠一碟${P[0].name}（${money(P[0].p*m)}）。</p>`;
return [['最多碟數',planMax],['均衡搭配',planBal],['高級享受',planTop]].map(([t,f])=>{
const c=f(P,B),tot=P.reduce((a,i)=>a+(c[i.id]||0)*i.p,0)*m;
return `<section class="plan"><h3>${t}</h3><div class="chips">`+P.filter(i=>c[i.id]).map(i=>`<span class="chip" style="--c:${i.c}">${i.name} ×${c[i.id]}</span>`).join('')+`</div><p>共 ${cnt(c)} 碟，${money(tot)}，剩餘 ${money(S.budget-tot)}</p></section>`}).join('')+`<p class="hint">${S.fee?'已計入':'未計入'} 10% 服務費。選好餐單後，切換到「計數」逐碟記錄。</p>`}

function vSplit(){
const it=items(),m=mult(),tots=S.people.map(p=>sum(p.c)*m),all=tots.reduce((a,b)=>a+b,0),avg=all/S.people.length;
return S.people.map((p,i)=>`<section class="person"><div class="ph"><input value="${esc(p.name)}" data-pn="${i}" aria-label="名稱" maxlength="12"><strong>${money(tots[i])}</strong>${S.people.length>1?`<button data-rp="${i}" aria-label="移除 ${esc(p.name)}">✕</button>`:''}</div>`+
it.map(x=>`<div class="row"><span class="dot" style="--c:${x.c}"></span><span class="nm2">${esc(x.name)} <span class="pr">${money(x.p)}</span></span><span class="st"><button data-pi="${i}" data-k="${x.id}" data-d="-1" aria-label="減一碟">−</button><b>${p.c[x.id]||0}</b><button data-pi="${i}" data-k="${x.id}" data-d="1" aria-label="加一碟">+</button></span></div>`).join('')+'</section>').join('')+
`<div class="btns"><button id="addp" class="pri">新增人士</button><button id="rstp">重設</button></div><section class="sum"><h3>分帳結果</h3>`+
S.people.map((p,i)=>{const d=tots[i]-avg,z=Math.abs(d)<0.005;return `<div class="row"><span class="nm2">${esc(p.name)}</span><span>${money(tots[i])}</span><span class="${z?'':d>0?'warn':'ok'}">${z?'等於平均':(d>0?'比平均多 ':'比平均少 ')+money(Math.abs(d))}</span></div>`}).join('')+
`<div class="row"><b>總額 ${money(all)}</b><span>平分每人 ${money(avg)}</span></div></section>`}

function vSet(){
return (S.msg?`<p class="bad">${S.msg}</p>`:'')+'<h2>碟價</h2><p class="hint">改成餐牌上的價格即可，瀏覽器會自動記住。</p>'+
items().map(i=>`<label class="set"><span class="dot" style="--c:${i.c}"></span><span class="nm2">${esc(i.name)}</span><input type="number" inputmode="decimal" min="0" step="any" value="${i.p}" data-price="${i.id}" aria-label="${esc(i.name)} 價格">${i.custom?`<button data-del="${i.id}">刪除</button>`:(i.p!==i.base?`<button data-rst="${i.id}">還原</button>`:'')}</label>`).join('')+
'<h2>自訂項目</h2><p class="hint">白碟海鮮價、季節限定、飲品、甜品都可以新增，每個地區最多 10 個。</p><div class="add"><input id="cn" placeholder="名稱，例如 白碟吞拿魚" maxlength="20"><input id="cp" type="number" inputmode="decimal" min="0" step="any" placeholder="價格"><button id="addc" class="pri">新增</button></div>'}

function bar(){
let c=S.counts;if(S.tab==='split'){c={};S.people.forEach(p=>{for(const k in p.c)c[k]=(c[k]||0)+p.c[k]})}
const t=sum(c)*mult();let b='',cls='';
if(S.budget>0&&S.tab!=='split'){const r=S.budget-t;cls=t>S.budget?'bad':t>=S.budget*.8?'warn':'';b=r>=0?`剩餘 ${money(r)}`:`已超出 ${money(-r)}`}
return `<div><small>${S.tab==='split'?'全部人合計':'目前總額'}${S.fee?'（含 10% 服務費）':''}</small><strong>${money(t)}</strong></div><div class="r">共 ${cnt(c)} 碟<br><span class="${cls}">${b}</span></div>`+(S.tab==='count'?'<button id="clr">清空</button>':'')}

function render(){
document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
$('v').innerHTML=({count:vCount,budget:vBudget,split:vSplit,set:vSet})[S.tab]();
$('bar').hidden=S.tab==='set';if(S.tab!=='set')$('bar').innerHTML=bar();
}

document.addEventListener('click',e=>{
const b=e.target.closest('button');if(!b)return;const d=b.dataset,id=b.id;
if(d.tab){S.tab=d.tab;S.msg=''}
else if(d.add)S.counts[d.add]=(S.counts[d.add]||0)+1;
else if(d.sub)S.counts[d.sub]=Math.max(0,(S.counts[d.sub]||0)-1);
else if(d.pi!==undefined){const p=S.people[d.pi];p.c[d.k]=Math.max(0,(p.c[d.k]||0)+Number(d.d))}
else if(d.rp!==undefined)S.people.splice(d.rp,1);
else if(d.rst){delete (S.ov[S.region]||{})[d.rst];save()}
else if(d.del){S.custom[S.region]=cu().filter(x=>x.id!==d.del);delete S.counts[d.del];S.people.forEach(p=>delete p.c[d.del]);save()}
else if(id==='clr')S.counts={};
else if(id==='addp')S.people.push({name:'朋友 '+(S.people.length+1),c:{}});
else if(id==='rstp')S.people=newPeople();
else if(id==='addc'){
const n=$('cn').value.trim(),p=parseFloat($('cp').value);S.msg='';
if(!n||!(p>=0)||isNaN(p))S.msg='請輸入名稱和價格。';
else if(cu().length>=10)S.msg='自訂項目已達 10 個上限，請先刪除一個。';
else{cu().push({id:'c'+Date.now(),name:n,p});save()}}
else return;
render()});

document.addEventListener('change',e=>{
const t=e.target,d=t.dataset;
if(t.id==='reg'){S.region=t.value;S.fee=S.region!=='jp';S.counts={};S.people.forEach(p=>p.c={});$('fee').checked=S.fee;save();render()}
else if(t.id==='fee'){S.fee=t.checked;save();render()}
else if(d.pn!==undefined)S.people[d.pn].name=t.value.trim()||'朋友';
else if(d.price){const v=parseFloat(t.value);if(!isNaN(v)&&v>=0){const c=cu().find(x=>x.id===d.price);if(c)c.p=v;else{const base=REG[S.region].p.find(x=>x[0]===d.price)[2];const o=S.ov[S.region]||(S.ov[S.region]={});if(v===base)delete o[d.price];else o[d.price]=v}save()}render()}
});
$('bud').addEventListener('input',e=>{S.budget=parseFloat(e.target.value)||0;render()});

$('reg').innerHTML=Object.entries(REG).map(([k,v])=>`<option value="${k}">${v.n}</option>`).join('');
$('reg').value=S.region;$('fee').checked=S.fee;
render();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
</script>
</body>
</html>
